name: Publish Extension

on:
  workflow_dispatch:

env:
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish latest release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        shell: bash

      - name: Get release version
        run: |
          TAG=$(gh release view \
            --repo "${{ github.repository }}" \
            --json tagName \
            --jq '.tagName')

          VERSION="${TAG#v}"

          echo "Release version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download latest release assets
        run: |
          mkdir -p release-assets

          gh release download \
            --repo "${{ github.repository }}" \
            --latest \
            --dir release-assets

      - name: Show release assets
        run: |
          echo "Latest release assets:"
          ls -lah release-assets

      - name: Publish to stores
        run: |
          npx wxt submit \
            --chrome-zip "release-assets/kosh-${VERSION}-chrome.zip" \
            --edge-zip "release-assets/kosh-${VERSION}-edge.zip" \
            --firefox-zip "release-assets/kosh-${VERSION}-firefox.zip" \
            --firefox-sources-zip "release-assets/kosh-${VERSION}-sources.zip"
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}

          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}

          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
